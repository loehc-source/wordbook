<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordBook">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.json">
<title>WordBook</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e3e;
    --accent: #7c6fff;
    --accent2: #ff6f91;
    --text: #f0eeff;
    --muted: #7070a0;
    --success: #4fffb0;
    --danger: #ff5f7e;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Noto Sans KR’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100dvh;
overflow: hidden;
display: flex;
flex-direction: column;
}

/* ── SCREENS ── */
.screen {
display: none;
flex-direction: column;
height: 100dvh;
padding-top: var(–safe-top);
padding-bottom: var(–safe-bottom);
overflow: hidden;
}
.screen.active { display: flex; }

/* ── HEADER ── */
.header {
padding: 18px 20px 14px;
display: flex;
align-items: center;
gap: 12px;
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
.header-back {
width: 36px; height: 36px;
background: var(–surface2);
border: none;
border-radius: 10px;
color: var(–text);
font-size: 18px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: background .15s;
}
.header-back:active { background: var(–border); }
.header-title {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 18px;
flex: 1;
}
.header-badge {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 20px;
padding: 4px 12px;
font-size: 13px;
color: var(–muted);
font-weight: 500;
}

/* ── HOME ── */
#home .hero {
flex: 1;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px 30px;
gap: 8px;
}
.logo-mark {
width: 72px; height: 72px;
background: linear-gradient(135deg, var(–accent), var(–accent2));
border-radius: 20px;
display: flex; align-items: center; justify-content: center;
font-size: 36px;
margin-bottom: 12px;
box-shadow: 0 0 40px rgba(124,111,255,0.3);
}
.app-name {
font-family: ‘Syne’, sans-serif;
font-weight: 800;
font-size: 32px;
background: linear-gradient(135deg, var(–accent), var(–accent2));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}
.app-sub {
font-size: 14px;
color: var(–muted);
margin-bottom: 16px;
}
.word-count-pill {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 20px;
padding: 6px 18px;
font-size: 14px;
color: var(–muted);
}
.word-count-pill span { color: var(–accent); font-weight: 700; }

.home-actions {
padding: 0 20px 20px;
display: flex;
flex-direction: column;
gap: 12px;
}
.btn-primary {
background: linear-gradient(135deg, var(–accent), #9b6fff);
border: none;
border-radius: 16px;
padding: 18px;
color: #fff;
font-family: ‘Syne’, sans-serif;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: opacity .15s, transform .1s;
letter-spacing: .3px;
}
.btn-primary:active { opacity: .85; transform: scale(.98); }
.btn-secondary {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 16px;
padding: 18px;
color: var(–text);
font-family: ‘Syne’, sans-serif;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: background .15s, transform .1s;
letter-spacing: .3px;
}
.btn-secondary:active { background: var(–surface2); transform: scale(.98); }

/* ── WORD LIST ── */
#wordlist .list-scroll {
flex: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
padding: 12px 16px;
}

.word-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 16px;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 14px;
position: relative;
transition: background .15s;
}
.word-card:active { background: var(–surface2); }
.word-num {
font-family: ‘Syne’, sans-serif;
font-size: 11px;
color: var(–muted);
min-width: 22px;
text-align: center;
}
.word-info { flex: 1; min-width: 0; }
.word-en {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 17px;
color: var(–text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.word-ko {
font-size: 13px;
color: var(–muted);
margin-top: 3px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.word-del {
background: none;
border: none;
color: var(–muted);
font-size: 20px;
cursor: pointer;
padding: 6px;
line-height: 1;
transition: color .15s;
}
.word-del:active { color: var(–danger); }

.empty-state {
text-align: center;
padding: 60px 30px;
color: var(–muted);
}
.empty-state .big { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 15px; line-height: 1.6; }

/* ── ADD WORD (FAB area) ── */
.add-bar {
padding: 14px 16px;
border-top: 1px solid var(–border);
background: var(–bg);
flex-shrink: 0;
}
.add-form {
display: flex;
gap: 8px;
align-items: flex-end;
}
.add-inputs {
flex: 1;
display: flex;
flex-direction: column;
gap: 6px;
}
.input-field {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
padding: 11px 14px;
color: var(–text);
font-size: 15px;
font-family: ‘Noto Sans KR’, sans-serif;
outline: none;
transition: border-color .2s;
width: 100%;
}
.input-field::placeholder { color: var(–muted); }
.input-field:focus { border-color: var(–accent); }
.input-field.en { font-family: ‘Syne’, sans-serif; font-weight: 600; }

.btn-add {
background: linear-gradient(135deg, var(–accent), #9b6fff);
border: none;
border-radius: 12px;
width: 50px; height: 50px;
color: #fff;
font-size: 24px;
cursor: pointer;
flex-shrink: 0;
align-self: flex-end;
transition: opacity .15s, transform .1s;
}
.btn-add:active { opacity: .8; transform: scale(.92); }

/* ── QUIZ SETUP ── */
#quizsetup .setup-body {
flex: 1;
overflow-y: auto;
padding: 20px 20px 0;
}
.section-label {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 13px;
color: var(–muted);
letter-spacing: 1.2px;
text-transform: uppercase;
margin-bottom: 12px;
}
.count-chips {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 28px;
}
.chip {
background: var(–surface);
border: 1.5px solid var(–border);
border-radius: 10px;
padding: 10px 18px;
font-family: ‘Syne’, sans-serif;
font-weight: 600;
font-size: 15px;
color: var(–muted);
cursor: pointer;
transition: all .15s;
}
.chip.active {
background: rgba(124,111,255,.15);
border-color: var(–accent);
color: var(–accent);
}
.chip:active { transform: scale(.95); }

.direction-toggle {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 28px;
}
.dir-btn {
background: var(–surface);
border: 1.5px solid var(–border);
border-radius: 12px;
padding: 14px 10px;
color: var(–muted);
font-size: 13px;
font-weight: 500;
cursor: pointer;
text-align: center;
transition: all .15s;
line-height: 1.4;
}
.dir-btn .dir-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.dir-btn.active {
background: rgba(124,111,255,.15);
border-color: var(–accent);
color: var(–text);
}
.dir-btn:active { transform: scale(.97); }

.quiz-info-box {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 16px;
margin-bottom: 24px;
display: flex;
align-items: center;
gap: 12px;
}
.quiz-info-icon { font-size: 24px; }
.quiz-info-text { font-size: 14px; color: var(–muted); line-height: 1.5; }
.quiz-info-text strong { color: var(–text); }

.setup-footer {
padding: 16px 20px;
border-top: 1px solid var(–border);
background: var(–bg);
flex-shrink: 0;
}

/* ── QUIZ ── */
#quiz .quiz-body {
flex: 1;
overflow-y: auto;
padding: 20px 20px 0;
display: flex;
flex-direction: column;
}

.progress-bar-wrap {
background: var(–surface);
border-radius: 4px;
height: 4px;
margin-bottom: 24px;
flex-shrink: 0;
}
.progress-bar-fill {
height: 100%;
background: linear-gradient(90deg, var(–accent), var(–accent2));
border-radius: 4px;
transition: width .4s ease;
}

.question-box {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 20px;
padding: 30px 24px;
margin-bottom: 20px;
text-align: center;
min-height: 130px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.q-label {
font-size: 11px;
color: var(–muted);
letter-spacing: 1.5px;
text-transform: uppercase;
margin-bottom: 10px;
font-weight: 500;
}
.q-word {
font-family: ‘Syne’, sans-serif;
font-weight: 800;
font-size: 30px;
line-height: 1.2;
color: var(–text);
}
.q-word.ko { font-family: ‘Noto Sans KR’, sans-serif; font-weight: 700; font-size: 22px; }

.options-grid {
display: flex;
flex-direction: column;
gap: 10px;
flex: 1;
}
.option-btn {
background: var(–surface);
border: 1.5px solid var(–border);
border-radius: 14px;
padding: 16px 18px;
color: var(–text);
font-size: 15px;
font-family: ‘Noto Sans KR’, sans-serif;
font-weight: 500;
cursor: pointer;
text-align: left;
display: flex;
align-items: center;
gap: 14px;
transition: background .15s, border-color .15s, transform .1s;
}
.option-btn:not(.revealed):active { transform: scale(.98); background: var(–surface2); }
.option-label {
width: 28px; height: 28px;
background: var(–surface2);
border-radius: 8px;
display: flex; align-items: center; justify-content: center;
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 13px;
color: var(–muted);
flex-shrink: 0;
transition: background .15s, color .15s;
}
.option-text { flex: 1; line-height: 1.35; }

.option-btn.correct {
border-color: var(–success);
background: rgba(79,255,176,.08);
}
.option-btn.correct .option-label {
background: var(–success);
color: #0f1a14;
}
.option-btn.wrong {
border-color: var(–danger);
background: rgba(255,95,126,.08);
}
.option-btn.wrong .option-label {
background: var(–danger);
color: #fff;
}
.option-btn.revealed { cursor: default; }

.quiz-footer {
padding: 16px 20px;
border-top: 1px solid var(–border);
background: var(–bg);
flex-shrink: 0;
}
.quiz-counter {
text-align: center;
font-size: 13px;
color: var(–muted);
margin-bottom: 12px;
font-weight: 500;
}

/* ── RESULT ── */
#result .result-body {
flex: 1;
overflow-y: auto;
padding: 20px;
}
.result-score-ring {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 32px 0 24px;
}
.score-circle {
width: 130px; height: 130px;
border-radius: 50%;
background: conic-gradient(var(–accent) 0%, var(–accent2) var(–pct), var(–surface) var(–pct));
display: flex; align-items: center; justify-content: center;
position: relative;
margin-bottom: 16px;
}
.score-inner {
width: 100px; height: 100px;
background: var(–bg);
border-radius: 50%;
display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.score-num {
font-family: ‘Syne’, sans-serif;
font-weight: 800;
font-size: 30px;
color: var(–text);
line-height: 1;
}
.score-denom {
font-size: 13px;
color: var(–muted);
}
.score-msg {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 20px;
text-align: center;
}

.result-section-title {
font-family: ‘Syne’, sans-serif;
font-weight: 700;
font-size: 13px;
color: var(–muted);
letter-spacing: 1px;
text-transform: uppercase;
margin-bottom: 10px;
margin-top: 4px;
}
.result-word-item {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 13px 16px;
margin-bottom: 8px;
display: flex;
gap: 10px;
align-items: flex-start;
}
.result-dot {
width: 8px; height: 8px;
border-radius: 50%;
margin-top: 5px;
flex-shrink: 0;
}
.result-dot.ok { background: var(–success); }
.result-dot.fail { background: var(–danger); }
.rw-en { font-family: ‘Syne’, sans-serif; font-weight: 700; font-size: 15px; }
.rw-ko { font-size: 13px; color: var(–muted); margin-top: 2px; }
.rw-ans { font-size: 12px; color: var(–danger); margin-top: 4px; }

.result-footer {
padding: 16px 20px;
border-top: 1px solid var(–border);
background: var(–bg);
display: flex;
gap: 10px;
flex-shrink: 0;
}
.result-footer .btn-secondary { flex: 1; padding: 15px; font-size: 14px; }
.result-footer .btn-primary { flex: 1; padding: 15px; font-size: 14px; }

/* ── TOAST ── */
.toast {
position: fixed;
bottom: calc(var(–safe-bottom) + 100px);
left: 50%; transform: translateX(-50%);
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 30px;
padding: 10px 20px;
font-size: 14px;
color: var(–text);
pointer-events: none;
opacity: 0;
transition: opacity .2s;
white-space: nowrap;
z-index: 999;
}
.toast.show { opacity: 1; }

/* scrollbar */
::-webkit-scrollbar { width: 0; }
</style>

</head>

<script>
// ── STATE ──
let words = JSON.parse(localStorage.getItem('wb_words') || '[]');
let quizWords = [], quizIdx = 0, quizDir = 'en', quizResults = [];
let selectedCount = 0, answered = false;

function save() { localStorage.setItem('wb_words', JSON.stringify(words)); }

// ── NAVIGATION ──
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'home') updateHome();
  if (id === 'wordlist') renderWordList();
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ── HOME ──
function updateHome() {
  document.getElementById('home-count').textContent = words.length;
}

// ── WORD LIST ──
function renderWordList() {
  const body = document.getElementById('word-list-body');
  document.getElementById('list-count').textContent = words.length + '개';
  if (!words.length) {
    body.innerHTML = `<div class="empty-state"><div class="big">📭</div><p>아직 단어가 없어요.<br>아래에서 첫 단어를 추가해보세요!</p></div>`;
    return;
  }
  body.innerHTML = words.map((w, i) => `
    <div class="word-card">
      <div class="word-num">${i + 1}</div>
      <div class="word-info">
        <div class="word-en">${esc(w.en)}</div>
        <div class="word-ko">${esc(w.ko)}</div>
      </div>
      <button class="word-del" onclick="deleteWord(${i})">×</button>
    </div>
  `).join('');
}

function addWord() {
  const en = document.getElementById('inp-en').value.trim();
  const ko = document.getElementById('inp-ko').value.trim();
  if (!en || !ko) { showToast('영어와 한국어 뜻을 모두 입력해주세요'); return; }
  if (words.some(w => w.en.toLowerCase() === en.toLowerCase())) {
    showToast('이미 있는 단어예요!'); return;
  }
  words.push({ en, ko });
  save();
  document.getElementById('inp-en').value = '';
  document.getElementById('inp-ko').value = '';
  document.getElementById('inp-en').focus();
  renderWordList();
}

function deleteWord(i) {
  words.splice(i, 1);
  save();
  renderWordList();
}

document.getElementById('inp-ko').addEventListener('keydown', e => {
  if (e.key === 'Enter') addWord();
});

// ── QUIZ SETUP ──
const COUNTS = [5, 10, 15, 20, 30, '전체'];

function startQuizSetup() {
  if (words.length < 4) {
    showToast('퀴즈는 최소 4개 단어가 필요해요');
    return;
  }
  // build chips
  const chips = document.getElementById('count-chips');
  chips.innerHTML = '';
  COUNTS.forEach(c => {
    const max = c === '전체' ? words.length : Math.min(c, words.length);
    if (max < 1 && c !== '전체') return;
    const active = (selectedCount === 0 && c === COUNTS[0]) || selectedCount === c;
    const el = document.createElement('div');
    el.className = 'chip' + (active ? ' active' : '');
    el.textContent = c === '전체' ? `전체 (${words.length})` : `${max}문제`;
    el.onclick = () => {
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      selectedCount = c;
      updateInfoBox();
    };
    chips.appendChild(el);
  });
  // default select first
  if (selectedCount === 0) selectedCount = COUNTS[0];
  chips.children[0] && chips.children[0].classList.add('active');
  updateInfoBox();
  goTo('quizsetup');
}

function updateInfoBox() {
  const n = selectedCount === '전체' ? words.length : Math.min(selectedCount, words.length);
  document.getElementById('info-q').textContent = n;
}

function setDir(dir) {
  quizDir = dir;
  document.getElementById('dir-en').classList.toggle('active', dir === 'en');
  document.getElementById('dir-ko').classList.toggle('active', dir === 'ko');
}

// ── QUIZ ──
function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function startQuiz() {
  const count = selectedCount === '전체' ? words.length : Math.min(selectedCount, words.length);
  quizWords = shuffle(words).slice(0, count);
  quizIdx = 0;
  quizResults = [];
  goTo('quiz');
  document.getElementById('quiz-title').textContent =
    quizDir === 'en' ? '영어 → 한국어' : '한국어 → 영어';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  document.getElementById('next-btn').style.display = 'none';

  const total = quizWords.length;
  const pct = (quizIdx / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('quiz-counter').textContent = `${quizIdx + 1} / ${total}`;

  const current = quizWords[quizIdx];
  const qWord = document.getElementById('q-word');
  const qLabel = document.getElementById('q-label');

  if (quizDir === 'en') {
    qWord.textContent = current.en;
    qWord.className = 'q-word';
    qLabel.textContent = 'ENGLISH → KOREAN';
  } else {
    qWord.textContent = current.ko;
    qWord.className = 'q-word ko';
    qLabel.textContent = 'KOREAN → ENGLISH';
  }

  // build options: 1 correct + 3 wrong from other words
  const others = words.filter(w => w.en !== current.en);
  const wrongs = shuffle(others).slice(0, 3);
  const options = shuffle([current, ...wrongs]);

  const grid = document.getElementById('options-grid');
  const labels = ['A', 'B', 'C', 'D'];
  grid.innerHTML = options.map((w, i) => {
    const display = quizDir === 'en' ? w.ko : w.en;
    return `
      <button class="option-btn" onclick="selectOption(this, '${esc(w.en)}', '${esc(current.en)}')">
        <div class="option-label">${labels[i]}</div>
        <div class="option-text">${esc(display)}</div>
      </button>
    `;
  }).join('');
}

function selectOption(btn, chosen, correct) {
  if (answered) return;
  answered = true;

  const isCorrect = chosen === correct;
  const allBtns = document.querySelectorAll('.option-btn');

  allBtns.forEach(b => {
    b.classList.add('revealed');
    const label = b.querySelector('.option-text').textContent;
    const btnWord = quizDir === 'en'
      ? words.find(w => w.ko === label)?.en
      : words.find(w => w.en === label)?.en;
    if (btnWord === correct) b.classList.add('correct');
  });

  if (!isCorrect) btn.classList.add('wrong');

  quizResults.push({ word: quizWords[quizIdx], correct: isCorrect, chosen });

  document.getElementById('next-btn').style.display = 'block';
  if (quizIdx === quizWords.length - 1) {
    document.getElementById('next-btn').textContent = '결과 보기 →';
  }
}

function nextQuestion() {
  quizIdx++;
  if (quizIdx >= quizWords.length) {
    showResult(); return;
  }
  loadQuestion();
}

function exitQuiz() {
  if (confirm('퀴즈를 종료할까요?')) goTo('home');
}

// ── RESULT ──
function showResult() {
  const total = quizResults.length;
  const correct = quizResults.filter(r => r.correct).length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('score-circle').style.setProperty('--pct', pct + '%');
  document.getElementById('score-num').textContent = correct;
  document.getElementById('score-denom').textContent = '/' + total;

  const msgs = [
    [100, '🎉 완벽해요!'],
    [80,  '🔥 훌륭해요!'],
    [60,  '👍 잘 했어요!'],
    [40,  '📚 조금 더 해봐요'],
    [0,   '💪 다시 도전!']
  ];
  document.getElementById('score-msg').textContent =
    msgs.find(([t]) => pct >= t)?.[1] || '다시 도전!';

  const wrong = quizResults.filter(r => !r.correct);
  const ok    = quizResults.filter(r => r.correct);

  const wrongList = document.getElementById('result-wrong-list');
  const okList = document.getElementById('result-correct-list');

  document.getElementById('result-wrong-section').style.display = wrong.length ? '' : 'none';

  wrongList.innerHTML = wrong.map(r => `
    <div class="result-word-item">
      <div class="result-dot fail"></div>
      <div>
        <div class="rw-en">${esc(r.word.en)}</div>
        <div class="rw-ko">${esc(r.word.ko)}</div>
        <div class="rw-ans">내 답: ${esc(r.chosen)}</div>
      </div>
    </div>
  `).join('');

  okList.innerHTML = ok.map(r => `
    <div class="result-word-item">
      <div class="result-dot ok"></div>
      <div>
        <div class="rw-en">${esc(r.word.en)}</div>
        <div class="rw-ko">${esc(r.word.ko)}</div>
      </div>
    </div>
  `).join('');

  goTo('result');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── PWA ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// init
updateHome();
</script>
